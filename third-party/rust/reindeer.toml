##
## Reindeer config for antlir's third-party Rust dependencies.
##
## Reconstructed 2026-07-12 (the OSS antlir export ships only the @generated
## BUCK, not the reindeer inputs). Models the existing generated
## third-party/rust/BUCK: unvendored (http_archive) mode, rules routed through
## the local defs.bzl wrappers.
##
## Regenerate with:
##   ~/reindeer-src/target/release/reindeer \
##       --third-party-dir third-party/rust buckify
##

# reindeer.toml is co-located with the third-party dir it manages.
third_party_dir = "."

# Parse Rust sources to compute the precise per-crate srcs (matches the
# generated BUCK, which lists explicit crate_root/srcs).
precise_srcs = true

# Emit a top-level target depending on every library (for check builds).
include_top_level = true

# Banner matching the current generated file.
generated_file_header = "# @generated by `reindeer buckify`"

# Unvendored: generate http_archive rules that fetch crates at build time
# (no vendored source tree). This is what the existing BUCK does.
[vendor]

[buck]
file_name = "BUCK"

# Map reindeer's abstract rule kinds onto the macros the generated BUCK uses.
# rust_library/rust_binary come from prelude's cargo_package.bzl `cargo` struct;
# the cxx_library + buildscript_run wrappers come from the local defs.bzl.
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
cxx_library = "third_party_rust_cxx_library"
prebuilt_cxx_library = "third_party_rust_cxx_library"

# http_archive / git_fetch / alias / filegroup stay at their bare defaults —
# they are buck2 builtins in this repo and the generated BUCK calls them bare.

# Load the macros the rules above resolve to. Reproduces the current BUCK's
# load() header.
buckfile_imports = """
load("@prelude//rust:cargo_package.bzl", "cargo")
load(":defs.bzl", "third_party_rust_cxx_library", "buildscript_run")
"""
