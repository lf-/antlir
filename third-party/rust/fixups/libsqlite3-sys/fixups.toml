# libsqlite3-sys's build.rs compiles bundled sqlite3.c via cc-rs. The buck
# rust build-script cc shim (from_any_dir.py -> execl bare "clang") does not
# work here, so instead of running the build script we build sqlite3 with a
# buck cxx_library and supply the pre-generated bindgen output as OUT_DIR
# (the crate ships sqlite3/bindgen_bundled_version.rs). Mirrors facebook/buck2.
buildscript.run = false

[env]
OUT_DIR = "$(location //third-party/rust/fixups/libsqlite3-sys:out_dir)"

[[cxx_library]]
name = "sqlite3"
srcs = ["sqlite3/sqlite3.c"]
headers = ["sqlite3/*.h"]
preprocessor_flags = [
    "-DSQLITE_CORE",
    "-DSQLITE_DEFAULT_FOREIGN_KEYS=1",
    "-DSQLITE_ENABLE_API_ARMOR",
    "-DSQLITE_ENABLE_COLUMN_METADATA",
    "-DSQLITE_ENABLE_DBSTAT_VTAB",
    "-DSQLITE_ENABLE_FTS3",
    "-DSQLITE_ENABLE_FTS3_PARENTHESIS",
    "-DSQLITE_ENABLE_FTS5",
    "-DSQLITE_ENABLE_JSON1",
    "-DSQLITE_ENABLE_LOAD_EXTENSION=1",
    "-DSQLITE_ENABLE_MEMORY_MANAGEMENT",
    "-DSQLITE_ENABLE_RTREE",
    "-DSQLITE_ENABLE_STAT4",
    "-DSQLITE_SOUNDEX",
    "-DSQLITE_THREADSAFE=1",
    "-DSQLITE_USE_URI",
    "-DHAVE_USLEEP=1",
    "-DHAVE_ISNAN",
    "-D_POSIX_THREAD_SAFE_FUNCTIONS",
    "-DHAVE_LOCALTIME_R",
]
